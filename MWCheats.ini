[Main]
; Endless Nitro meter
InfiniteNitro = true

; Endless Speedbreaker duration
InfiniteSpeedbreaker = true

; Engine horsepower multiplier (1.0 = stock, 2.0 = double power)
EnginePowerMultiplier = 1.0

; Unlimited tire grip to eliminate sliding
InfiniteGrip = false

; Disable aggressive AI catch-up (rubberbanding)
DisableRubberbanding = true

; Freeze opponent AI drivers in place during races
FreezeAI = false

; Remove civilian traffic vehicles from the map
DisableTraffic = false

; Hide all HUD elements (speedometer, minimap, gauges)
HideHUD = false

[Career]
; Enable infinite cash balance
InfiniteCash = false

; Cash reward multiplier (1.0 = normal)
CashMultiplier = 5.0

; Unlock every car in the car lot, plus traffic cars, cop cars, the helicopter and the AI preset cars
UnlockAllCars = false

; Unlock every performance upgrade in the shop
UnlockAllPerformanceParts = false

; Unlock every visual part in the shop
UnlockAllVisualParts = false

; Grant unlimited Junkman performance parts in My Cars / Performance shop
InfiniteJunkmanParts = true

; Unlock all Blacklist rivals and milestone races immediately
UnlockAllBlacklist = false

; Always award the rival's Pink Slip marker after defeating Blacklist bosses
AlwaysWinPinkSlip = true

; Free impound bail and bypass impound strike cards
FreeImpoundBail = true

; Prevent cars from ever being impounded regardless of strike count
NeverImpoundCar = true

; Freeze race countdown timer during Tollbooth career events
InfiniteTollboothTime = false

[Pursuit]
; Disable busting timer completely
BustProof = true

; Ignore spikestrips and prevent tire pops
SpikeProof = true

; Extreme vehicle mass to push through cops/Rhinos
TankMode = false

; Disable physical collision with cop vehicles
GhostCops = false

; Stop police helicopter from spawning
DisableHelicopter = false

; How many helicopters can chase you at once (1 = normal, extras join a few seconds apart)
MaxHelicopters = 1

; Prevent police helicopter from running out of fuel and leaving
InfiniteHelicopterFuel = false

; Stop cops from setting up roadblocks
DisableRoadblocks = false

; Disable police backup reinforcement call-in waves
DisableReinforcements = false

; Cops ignore player completely
CopsIgnorePlayer = false

; Instantly end pursuit when entering Cooldown
InstantCooldown = false

; Bounty gain multiplier (1.0 = normal)
BountyMultiplier = 10.0

; Lock heat level to prevent changes
FreezeHeatLevel = false

; Target heat level if forced (1.0 to 10.0)
SetHeatLevel = 5.0

; Instantly destroy police vehicles upon contact
TouchOfDeathCops = false

; Hitting a single pursuit breaker instantly destroys and deactivates all cops map-wide
PursuitBreakerNuke = false

[Misc]
; Achievement popup and chime when the game starts
LoadedPopup = true

; Extra field of view in degrees for every car you drive (0 = stock, 20 = wider, -10 = narrower)
FOVSlider = 0
